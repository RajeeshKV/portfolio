<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Rajeesh KV — Staff Engineer & Backend Architect. Architecting scalable enterprise systems with expertise in .NET Core, Microservices, and Cloud Infrastructure." />
    <meta name="theme-color" content="#0e0e0f" />
    <title>Rajeesh KV | Staff Engineer & Backend Architect</title>

    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300;400;500;600;700&family=Inter:wght@300;400;500;600&family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet" />

    <!-- Material Symbols -->
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet" />
  </head>
  <body>
    <div id="root">
      <style>
        body { background-color: #0e0e0f; margin: 0; }
        .skeleton-screen { box-sizing: border-box; display: flex; flex-direction: column; height: 100vh; padding: 20px 24px; gap: 40px; }
        .skeleton-nav { display: flex; justify-content: space-between; align-items: center; height: 40px; }
        .pulse { animation: skeleton-pulse 1.5s ease-in-out infinite; background-color: #262627; border-radius: 4px; }
        .skel-logo { width: 120px; height: 24px; }
        .skel-menu { width: 40px; height: 24px; border-radius: 50%; }
        .skeleton-hero { flex-grow: 1; margin-top: 10vh; }
        .skel-label { width: 220px; height: 14px; margin-bottom: 24px; border-radius: 20px; }
        .skel-title-1 { width: 80%; max-width: 400px; height: 60px; margin-bottom: 12px; }
        .skel-title-2 { width: 60%; max-width: 300px; height: 60px; margin-bottom: 12px; }
        .skel-title-3 { width: 40%; max-width: 200px; height: 60px; margin-bottom: 32px; }
        .skel-desc-1 { width: 90%; max-width: 500px; height: 16px; margin-bottom: 12px; }
        .skel-desc-2 { width: 70%; max-width: 400px; height: 16px; margin-bottom: 40px; }
        .skel-buttons { display: flex; gap: 16px; }
        .skel-btn-1 { width: 160px; height: 50px; border-radius: 25px; }
        .skel-btn-2 { width: 140px; height: 50px; border-radius: 25px; }
        @keyframes skeleton-pulse {
          0% { opacity: 1; }
          50% { opacity: 0.4; }
          100% { opacity: 1; }
        }
      </style>
      <div class="skeleton-screen">
        <div class="skeleton-nav">
          <div class="pulse skel-logo"></div>
          <div class="pulse skel-menu"></div>
        </div>
        <div class="skeleton-hero">
          <div class="pulse skel-label"></div>
          <div class="pulse skel-title-1"></div>
          <div class="pulse skel-title-2"></div>
          <div class="pulse skel-title-3"></div>
          <div class="pulse skel-desc-1"></div>
          <div class="pulse skel-desc-2"></div>
          <div class="skel-buttons">
            <div class="pulse skel-btn-1"></div>
            <div class="pulse skel-btn-2"></div>
          </div>
        </div>
      </div>
    </div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
